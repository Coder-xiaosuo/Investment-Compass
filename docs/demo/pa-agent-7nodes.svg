<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#7B1FA2"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#F9A825"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#1DC981"/>
    </marker>
    <style>
      .layer-title { font-size: 14px; font-weight: 700; fill: #171717; }
      .node-title { font-size: 12px; font-weight: 600; fill: #171717; }
      .node-sub { font-size: 10px; fill: #52525B; }
      .node-detail { font-size: 9px; fill: #71717A; }
      .badge { font-size: 9px; font-weight: 600; }
      .conn-label { font-size: 9px; fill: #52525B; }
      .panel-title { font-size: 10px; font-weight: 700; fill: #171717; }
      .panel-line { font-size: 9px; fill: #52525B; }
      .annot { font-size: 9px; fill: #52525B; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="720" rx="12" fill="#F7F7F8"/>

  <!-- ============ INPUT BOX above ① ============ -->
  <g>
    <rect x="20" y="16" width="200" height="42" rx="6" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="120" y="32" text-anchor="middle" class="node-sub" fill="#7B1FA2" font-weight="700">输入 Input</text>
    <text x="120" y="48" text-anchor="middle" class="node-detail">stock_identifier + va_summary</text>
    <line x1="120" y1="58" x2="120" y2="66" stroke="#7B1FA2" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- ============ ROW 1 ARROWS ============ -->
  <line x1="220" y1="130" x2="246" y2="130" stroke="#7B1FA2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="130" x2="476" y2="130" stroke="#7B1FA2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="130" x2="706" y2="130" stroke="#7B1FA2" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ ① parse_node ============ -->
  <g transform="translate(20,70)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="1.5"/>
    <g transform="translate(10,11)" stroke="#7B1FA2" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="5,3 1,7 5,11"/>
      <polyline points="11,3 15,7 11,11"/>
      <line x1="9.5" y1="2" x2="6.5" y2="12"/>
    </g>
    <text x="32" y="22" class="node-title">① parse_node</text>
    <g transform="translate(150,10)">
      <rect x="0" y="0" width="40" height="16" rx="8" fill="#7B1FA2"/>
      <text x="20" y="11.5" text-anchor="middle" class="badge" fill="#FFFFFF">纯代码</text>
    </g>
    <line x1="10" y1="34" x2="190" y2="34" stroke="#E4E4E7"/>
    <text x="10" y="50" class="node-detail">get_kline_bars(1d, 100)</text>
    <text x="10" y="64" class="node-detail">compute_market_data()</text>
    <text x="10" y="78" class="node-detail">generate_trace_id()</text>
    <text x="10" y="98" class="node-sub" fill="#7B1FA2">输出: stock_code / bars / market_data</text>
  </g>

  <!-- ============ ② features_node ============ -->
  <g transform="translate(250,70)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="1.5"/>
    <g transform="translate(10,11)" stroke="#7B1FA2" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="5,3 1,7 5,11"/>
      <polyline points="11,3 15,7 11,11"/>
      <line x1="9.5" y1="2" x2="6.5" y2="12"/>
    </g>
    <text x="32" y="22" class="node-title">② features_node</text>
    <g transform="translate(150,10)">
      <rect x="0" y="0" width="40" height="16" rx="8" fill="#7B1FA2"/>
      <text x="20" y="11.5" text-anchor="middle" class="badge" fill="#FFFFFF">纯代码</text>
    </g>
    <line x1="10" y1="34" x2="190" y2="34" stroke="#E4E4E7"/>
    <text x="10" y="50" class="node-detail">pa_features.from_bars()</text>
    <text x="10" y="64" class="node-detail">render_all_features()</text>
    <text x="10" y="78" class="node-detail">K线结构特征文本</text>
    <text x="10" y="98" class="node-sub" fill="#7B1FA2">LLM 客观锚点防捏造</text>
  </g>

  <!-- ============ ③ stage1_node ============ -->
  <g transform="translate(480,70)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="#FFFFFF" stroke="#4B3FE3" stroke-width="1.5"/>
    <g transform="translate(9,10)" stroke="#4B3FE3" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 3 L15 3 L15 10 L8.5 10 L5.5 13 L5.5 10 L2 10 Z"/>
      <circle cx="5.5" cy="6.5" r="0.6" fill="#4B3FE3" stroke="none"/>
      <circle cx="8.5" cy="6.5" r="0.6" fill="#4B3FE3" stroke="none"/>
      <circle cx="11.5" cy="6.5" r="0.6" fill="#4B3FE3" stroke="none"/>
    </g>
    <text x="32" y="22" class="node-title">③ stage1_node</text>
    <g transform="translate(146,10)">
      <rect x="0" y="0" width="44" height="16" rx="8" fill="#4B3FE3"/>
      <text x="22" y="11.5" text-anchor="middle" class="badge" fill="#FFFFFF">LLM × 1</text>
    </g>
    <line x1="10" y1="34" x2="190" y2="34" stroke="#E4E4E7"/>
    <text x="10" y="50" class="node-detail">市场诊断 → MarketDiagnosis</text>
    <text x="10" y="64" class="node-detail">cycle_position / direction</text>
    <text x="10" y="78" class="node-detail">detected_patterns</text>
    <text x="10" y="98" class="node-sub" fill="#4B3FE3">support / resistance levels</text>
  </g>

  <!-- ============ ④ load_strategies_node ============ -->
  <g transform="translate(710,70)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="#FFFFFF" stroke="#F57C00" stroke-width="1.5"/>
    <g transform="translate(10,11)" stroke="#F57C00" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="2" y1="4" x2="15" y2="4"/>
      <line x1="2" y1="8" x2="15" y2="8"/>
      <line x1="2" y1="12" x2="10" y2="12"/>
    </g>
    <text x="32" y="22" class="node-title">④ load_strategies</text>
    <g transform="translate(150,10)">
      <rect x="0" y="0" width="40" height="16" rx="8" fill="#F57C00"/>
      <text x="20" y="11.5" text-anchor="middle" class="badge" fill="#FFFFFF">纯代码</text>
    </g>
    <line x1="10" y1="34" x2="190" y2="34" stroke="#E4E4E7"/>
    <text x="10" y="50" class="node-detail">_route_strategy()</text>
    <text x="10" y="64" class="node-detail">33 策略文件路由</text>
    <text x="10" y="78" class="node-detail">A股专属: 涨停/缺口/支撑阻力</text>
    <text x="10" y="98" class="node-sub" fill="#F57C00">通道 / 区间 / 极速 / 窄宽</text>
  </g>

  <!-- ============ CONNECTOR ④ → ⑤ (curved L-bend) ============ -->
  <path d="M 810 190 L 810 210 Q 810 220 800 220 L 130 220 Q 120 220 120 230 L 120 326" fill="none" stroke="#7B1FA2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="465" y="214" text-anchor="middle" class="conn-label">strategies + features + stage1 → 下游</text>

  <!-- ============ STRATEGY FILES DETAIL PANEL (below ④) ============ -->
  <g transform="translate(270,236)">
    <rect x="0" y="0" width="640" height="84" rx="8" fill="#FFFBF5" stroke="#F57C00" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="12" y="16" class="panel-title" fill="#F57C00">④ load_strategies — 策略文件路由详情 (33 Skills)</text>
    <line x1="12" y1="22" x2="628" y2="22" stroke="#FBE2C4"/>
    <!-- col 1 -->
    <text x="12" y="36" class="panel-line">• 通道族: 上涨/下跌/震荡 (分析+交易成对)</text>
    <text x="12" y="50" class="panel-line">• 极速族: 极速上涨/下跌 (分析+交易)</text>
    <text x="12" y="64" class="panel-line">• A股专属: 涨停板/缺口/支撑阻力/板块联动</text>
    <text x="12" y="78" class="panel-line">• 恒有: 逐棒检查单/K线信号/止损止盈/MeasuredMove</text>
    <!-- col 2 -->
    <text x="330" y="36" class="panel-line">• 形态: 楔形/三角形/双重顶底/铁丝网</text>
    <text x="330" y="50" class="panel-line">• 计数: H1H2-L1L2 / AlwaysIn / 二元决策</text>
    <text x="330" y="78" class="panel-line" font-weight="700" fill="#F57C00">Total: 33 Skills</text>
  </g>

  <!-- ============ CHROMADB (left of ⑤, amber dashed arrow into ⑤) ============ -->
  <g transform="translate(25,252)">
    <rect x="0" y="0" width="88" height="66" rx="6" fill="#FFFDF5" stroke="#F9A825" stroke-width="1.2" stroke-dasharray="4 3"/>
    <!-- db cylinder icon -->
    <g transform="translate(34,8)" stroke="#F9A825" stroke-width="1.3" fill="none" stroke-linecap="round">
      <ellipse cx="10" cy="3" rx="8" ry="2.6"/>
      <path d="M2 3 L2 14 Q2 16.6 10 16.6 Q18 16.6 18 14 L18 3"/>
      <path d="M2 8.5 Q2 11 10 11 Q18 11 18 8.5"/>
    </g>
    <text x="44" y="40" text-anchor="middle" class="annot" font-weight="700" fill="#F9A825">ChromaDB</text>
    <text x="44" y="52" text-anchor="middle" class="annot">经验库</text>
    <text x="44" y="63" text-anchor="middle" class="annot" fill="#71717A">bge-small-zh-v1.5</text>
  </g>
  <!-- amber dashed arrow from ChromaDB into ⑤ top -->
  <path d="M 113 300 Q 80 320 70 326" fill="none" stroke="#F9A825" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>

  <!-- ============ ROW 2 ARROWS ============ -->
  <line x1="220" y1="390" x2="244" y2="390" stroke="#7B1FA2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="458" y1="390" x2="476" y2="390" stroke="#7B1FA2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="390" x2="706" y2="390" stroke="#1DC981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- ============ ⑤ inject_experience_node ============ -->
  <g transform="translate(20,330)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="#FFFFFF" stroke="#F9A825" stroke-width="1.5"/>
    <g transform="translate(10,11)" stroke="#F9A825" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="6" cy="6" r="4"/>
      <line x1="9.2" y1="9.2" x2="13" y2="13"/>
    </g>
    <text x="32" y="22" class="node-title">⑤ inject_experience</text>
    <g transform="translate(144,10)">
      <rect x="0" y="0" width="46" height="16" rx="8" fill="#F9A825"/>
      <text x="23" y="11.5" text-anchor="middle" class="badge" fill="#FFFFFF">代码+检索</text>
    </g>
    <line x1="10" y1="34" x2="190" y2="34" stroke="#E4E4E7"/>
    <text x="10" y="50" class="node-detail">inject_experience()</text>
    <text x="10" y="64" class="node-detail">ChromaDB 三层检索</text>
    <text x="10" y="78" class="node-detail">≤3 条 · ≤1200 字</text>
    <text x="10" y="98" class="node-sub" fill="#F9A825">回测模式禁用</text>
  </g>

  <!-- ============ ⑥ pa_node (FOCAL) ============ -->
  <g transform="translate(246,324)">
    <rect x="0" y="0" width="212" height="132" rx="9" fill="#FFFFFF" stroke="#4B3FE3" stroke-width="2.6"/>
    <rect x="0" y="0" width="212" height="132" rx="9" fill="none" stroke="#4B3FE3" stroke-width="1" opacity="0.25" transform="translate(2,2)"/>
    <g transform="translate(10,12)" stroke="#4B3FE3" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 3 L16 3 L16 11 L9 11 L6 14.5 L6 11 L2 11 Z"/>
      <circle cx="6" cy="7" r="0.7" fill="#4B3FE3" stroke="none"/>
      <circle cx="9.5" cy="7" r="0.7" fill="#4B3FE3" stroke="none"/>
      <circle cx="13" cy="7" r="0.7" fill="#4B3FE3" stroke="none"/>
    </g>
    <text x="34" y="24" class="node-title" font-size="13">⑥ pa_node</text>
    <text x="34" y="37" class="annot" fill="#4B3FE3" font-weight="700">★ 焦点节点 Focal</text>
    <g transform="translate(150,12)">
      <rect x="0" y="0" width="52" height="18" rx="9" fill="#4B3FE3"/>
      <text x="26" y="12.5" text-anchor="middle" class="badge" fill="#FFFFFF" font-size="10">LLM × 1</text>
    </g>
    <line x1="10" y1="46" x2="202" y2="46" stroke="#E4E4E7"/>
    <text x="10" y="60" class="node-detail">交易决策 → TechnicalResult</text>
    <text x="10" y="74" class="node-detail">direction / entry_price / stop_loss</text>
    <text x="10" y="88" class="node-detail">estimated_win_rate</text>
    <text x="10" y="102" class="node-detail">key_factors / watch_points</text>
    <text x="10" y="118" class="node-sub" fill="#4B3FE3">融合 features + stage1 + experience</text>
  </g>

  <!-- ============ ⑦ merge_node ============ -->
  <g transform="translate(480,330)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="#FFFFFF" stroke="#1DC981" stroke-width="1.5"/>
    <g transform="translate(10,11)" stroke="#1DC981" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="5,3 1,7 5,11"/>
      <polyline points="11,3 15,7 11,11"/>
      <line x1="9.5" y1="2" x2="6.5" y2="12"/>
    </g>
    <text x="32" y="22" class="node-title">⑦ merge_node</text>
    <g transform="translate(150,10)">
      <rect x="0" y="0" width="40" height="16" rx="8" fill="#1DC981"/>
      <text x="20" y="11.5" text-anchor="middle" class="badge" fill="#FFFFFF">纯代码</text>
    </g>
    <line x1="10" y1="34" x2="190" y2="34" stroke="#E4E4E7"/>
    <text x="10" y="50" class="node-detail">_build_fusion(VA + PA)</text>
    <text x="10" y="64" class="node-detail">_save_decision_card(upsert)</text>
    <text x="10" y="78" class="node-detail">_notify_feishu(幂等)</text>
    <text x="10" y="98" class="node-sub" fill="#1DC981">trace_id 贯穿全链路</text>
  </g>

  <!-- ============ DecisionCard OUTPUT ============ -->
  <g transform="translate(710,330)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="#F0FDF7" stroke="#1DC981" stroke-width="1.5"/>
    <g transform="translate(10,11)" stroke="#1DC981" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="13" height="11" rx="1.5"/>
      <line x1="5" y1="6" x2="12" y2="6"/>
      <line x1="5" y1="9" x2="10" y2="9"/>
    </g>
    <text x="32" y="22" class="node-title">DecisionCard</text>
    <g transform="translate(160,10)">
      <rect x="0" y="0" width="30" height="16" rx="8" fill="#1DC981"/>
      <text x="15" y="11.5" text-anchor="middle" class="badge" fill="#FFFFFF">输出</text>
    </g>
    <line x1="10" y1="34" x2="190" y2="34" stroke="#BBF7DB"/>
    <text x="10" y="50" class="node-detail">action: BUY / SELL / HOLD</text>
    <text x="10" y="64" class="node-detail">fusion 复合决策</text>
    <text x="10" y="78" class="node-detail">review_outcome (待复盘)</text>
    <text x="10" y="98" class="node-sub" fill="#1DC981">data_sources JSON</text>
  </g>

  <!-- ============ VA summary input below ⑥ (purple dashed) ============ -->
  <g transform="translate(286,468)">
    <rect x="0" y="0" width="132" height="30" rx="6" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="66" y="14" text-anchor="middle" class="annot" fill="#7B1FA2" font-weight="700">va_summary</text>
    <text x="66" y="25" text-anchor="middle" class="annot">估值结论注入</text>
  </g>
  <line x1="352" y1="468" x2="352" y2="460" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- ============ ROW LABELS ============ -->
  <text x="948" y="60" text-anchor="end" class="annot" fill="#71717A">Row 1 · 数据/特征/诊断/路由</text>
  <text x="948" y="320" text-anchor="end" class="annot" fill="#71717A">Row 2 · 经验/决策/融合/输出</text>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(20,520)">
    <rect x="0" y="0" width="920" height="150" rx="8" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
    <text x="14" y="20" class="panel-title">图例 Legend · 节点类型与连接说明</text>
    <line x1="14" y1="26" x2="906" y2="26" stroke="#E4E4E7"/>

    <!-- legend row 1 -->
    <g transform="translate(20,40)">
      <rect x="0" y="0" width="16" height="12" rx="3" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="1.5"/>
      <text x="24" y="10" class="annot">纯代码节点 (Purple #7B1FA2) — ①parse ②features ⑦merge</text>
    </g>
    <g transform="translate(20,58)">
      <rect x="0" y="0" width="16" height="12" rx="3" fill="#FFFFFF" stroke="#4B3FE3" stroke-width="1.5"/>
      <text x="24" y="10" class="annot">LLM 节点 (Blue #4B3FE3) — ③stage1 ⑥pa (焦点)</text>
    </g>
    <g transform="translate(20,76)">
      <rect x="0" y="0" width="16" height="12" rx="3" fill="#FFFFFF" stroke="#F57C00" stroke-width="1.5"/>
      <text x="24" y="10" class="annot">策略路由 (Orange #F57C00) — ④load_strategies</text>
    </g>
    <g transform="translate(20,94)">
      <rect x="0" y="0" width="16" height="12" rx="3" fill="#FFFFFF" stroke="#F9A825" stroke-width="1.5"/>
      <text x="24" y="10" class="annot">经验检索 (Amber #F9A825) — ⑤inject_experience</text>
    </g>
    <g transform="translate(20,112)">
      <rect x="0" y="0" width="16" height="12" rx="3" fill="#F0FDF7" stroke="#1DC981" stroke-width="1.5"/>
      <text x="24" y="10" class="annot">融合/输出 (Green #1DC981) — ⑦merge → DecisionCard</text>
    </g>

    <!-- legend row 2 (connectors) -->
    <g transform="translate(470,40)">
      <line x1="0" y1="6" x2="28" y2="6" stroke="#7B1FA2" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="36" y="10" class="annot">主流程箭头 (实线紫色)</text>
    </g>
    <g transform="translate(470,58)">
      <line x1="0" y1="6" x2="28" y2="6" stroke="#F9A825" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>
      <text x="36" y="10" class="annot">经验检索注入 (虚线琥珀)</text>
    </g>
    <g transform="translate(470,76)">
      <line x1="0" y1="6" x2="28" y2="6" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
      <text x="36" y="10" class="annot">输入/上下文注入 (虚线紫色)</text>
    </g>
    <g transform="translate(470,94)">
      <line x1="0" y1="6" x2="28" y2="6" stroke="#1DC981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
      <text x="36" y="10" class="annot">输出箭头 (实线绿色)</text>
    </g>
    <g transform="translate(470,112)">
      <rect x="0" y="0" width="16" height="12" rx="3" fill="#FFFFFF" stroke="#4B3FE3" stroke-width="2.6"/>
      <text x="24" y="10" class="annot">焦点节点 (加粗边框)</text>
    </g>

    <text x="14" y="140" class="annot" fill="#71717A">流程: ①parse → ②features → ③stage1 → ④load_strategies ↓ ⑤inject_experience → ⑥pa → ⑦merge → DecisionCard</text>
  </g>

  <!-- ============ TITLE ============ -->
  <text x="480" y="700" text-anchor="middle" class="layer-title">Investment Compass — PA Agent LangGraph 7 节点详图</text>
</svg>
